name: Bug report
description: Something in the Geslar CLI does not work as documented
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Do not paste real secrets.** No passwords, tokens (a `gsm_…` token of an agent or a service account included, and the value of `GESLAR_SERVICE_TOKEN`), API keys, `.env` contents, or vault items — not in the text, not in a screenshot, not in a log. Redact before you post. If you have already posted one somewhere, revoke it and tell us.

        **Found a security vulnerability?** Do not use this form — follow [SECURITY.md](https://github.com/geslar-eu/geslar-cli/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I have checked the [README](https://github.com/geslar-eu/geslar-cli#what-this-does-not-protect-against) and the [CHANGELOG](https://github.com/geslar-eu/geslar-cli/blob/main/CHANGELOG.md) and this is not a documented limitation
          required: true
        - label: I have removed every real secret, token (`gsm_…` included), and vault name I would not want public
          required: true

  - type: input
    id: version
    attributes:
      label: Geslar CLI version
      description: Output of `geslar --version`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version` (the CLI needs Node.js 22 or newer)
      placeholder: "v22.12.0"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How are you using the CLI?
      options:
        - "As myself (geslar login)"
        - "With an agent profile (--agent / GESLAR_AGENT)"
        - "As an MCP server (geslar mcp serve)"
        - "In CI with a service account (GESLAR_SERVICE_TOKEN)"
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP client and version (optional)
      description: Only if you use `geslar mcp serve`. The name and version of the client that starts it (for example Claude Code, Claude Desktop, Cursor, or another), and the operating system it runs on. Never paste its configuration file without removing tokens.
      placeholder: "client name, version, operating system"
    validations:
      required: false

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - "npm install -g @geslar/cli"
        - "npx @geslar/cli"
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message and exit code if there was one.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order, with secrets redacted.
      render: shell
      placeholder: |
        geslar unlock --ttl 30m
        geslar run -e DB_PASSWORD=geslar://REDACTED/REDACTED/password -- ./start-server.sh
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Anything that might matter — corporate proxy, unusual Node version, antivirus, restricted account.
    validations:
      required: false
